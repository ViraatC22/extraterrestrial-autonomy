name: numerical reproducibility (Linux)

# Runs the Study 2 engine on every VALIDATION seed on Linux x86-64 and uploads
# the per-mission fingerprints, to compare with the same run on macOS arm64
# (scripts/numerical_reproducibility.py). Validation seeds only.
on:
  workflow_dispatch:
    inputs:
      label:
        description: "run label (e.g. baseline, fixed)"
        required: true
        default: baseline

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt || pip install -r requirements.txt
          pip install -e .
      - run: python scripts/numerical_reproducibility.py run --tag linux_x86_64 --label ${{ inputs.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: numerics-${{ inputs.label }}
          path: data/validation/numerics/${{ inputs.label }}_linux_x86_64*
