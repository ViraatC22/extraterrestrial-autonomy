[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-swarm-nav"
version = "0.1.0"
description = "Decentralized vs. learned swarm coordination for communication-constrained lunar surface exploration"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
