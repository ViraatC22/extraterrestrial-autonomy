[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exonaut"
version = "0.1.0"
description = "EXONAUT: adaptive risk-aware autonomy for robotic exploration of uncertain extraterrestrial terrain"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
